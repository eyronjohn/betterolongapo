# Olongapo Municipality Data
# Non-technical contributors can edit this file to update content on the About Olongapo .

name: Olongapo City
province: Zambales
region: Region III (Central Luzon)

description: >
  Olongapo is a vibrant, highly urbanized coastal city in Zambales, Philippines, 
  renowned as a former U.S. Naval base turned tourism, industrial, and commercial hub.

history: >
  Long ago along the shores of Subic Bay, there lived a village 
  led by a wise and just chieftain known as Apo, who was loved 
  for his fairness and compassion toward his people. His 
  leadership brought peace and unity, but he was later taken and 
  killed by envious enemies who feared his influence. When his 
  head was discovered, the grieving villagers cried “Ulo ng Apo,” 
  turning their sorrow into a rallying cry of unity and resistance. 
  From this event, the place came to be known as 
  Olongapo, a name that honors the memory of their beloved leader.

geography: >
  Olongapo is a coastal, highly urbanized city in Zambales, 
  Central Luzon, Philippines, situated 127 km north of Manila. 
  It is defined by its, mountain-fringed, triangular landscape 
  between the rugged Zambales Mountains and Subic Bay

