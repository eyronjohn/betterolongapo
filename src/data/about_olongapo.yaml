timeline:
  - year: Pre-1868
    event: >
      Early coastal communities develop around Subic Bay, with 
      settlements sustained by fishing and maritime activity. 
      The area becomes an important natural 
      harbor and local trading point long before formal colonial control.

  - year: 1868-1885
    event: >
      Spain recognizes the strategic value of Subic Bay and 
      establishes a naval presence, eventually forming a 
      settlement that becomes Olongapo. By 1885, the Spanish Navy constructs the 
      Arsenal and develops the area into a fortified naval station.

  - year: 1898–1945
    event: >
      After the Spanish–American War, control passes to the 
      United States, which expands and modernizes the naval 
      base under executive order. During World War II, the area 
      is destroyed and occupied by Japanese forces, then later 
      liberated by Filipino and American troops.

  - year: 1946–1966
    event: >
      After Philippine independence, Olongapo is rebuilt around the 
      remaining U.S. naval base and gradually develops into a 
      self-sustaining town. In 1966, it is officially converted into a chartered city through R.A. 4645, 
      marking its formal political establishment.

  - year: Present
    event: >
      Olongapo continues to grow as highly-urbanized cityand a home to over 264,000
      residents across 17 barangays.

card_description: >
  The southern gateway between Luzon and the Visayas — a coastal municipality
  defined by the sea, the San Bernardino Strait, and the constant movement of
  people passing through.
